version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups:
      frontend: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /backend/outils
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /deploiement
    schedule: { interval: monthly }
