name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/outils/package-lock.json
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Parseur Cooklang
        run: npm ci
        working-directory: backend/outils
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Lint
        run: npm run lint
      - name: svelte-check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Parcours de bout en bout
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Serveur en mode démonstration
        working-directory: backend
        run: |
          uv sync --frozen --python 3.12
          (cd outils && npm ci)
          AC_RACINE="$RUNNER_TEMP/aide-culinaire" AC_MOTEUR=factice AC_PORT=8765 uv run python -m app &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/api/session && break; sleep 1; done
      - name: Parcours
        working-directory: frontend
        run: npm run e2e
        env:
          AC_URL: http://127.0.0.1:8765

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: deploiement/Dockerfile
          failure-threshold: error
      - name: Construction
        run: docker build -f deploiement/Dockerfile -t aide-culinaire:ci .
