[project]
name = "aide-culinaire"
version = "1.0.0"
description = "Serveur Aide Culinaire auto-hébergé"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "rclone-bin>=1.60"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
